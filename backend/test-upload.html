<!DOCTYPE html>
<html>
<head>
    <title>Test Doctor Upload</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 12px 20px; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        h1 { color: #333; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🩺 Test Add Doctor API</h1>
    <form id="doctorForm">
        <label>Name:</label>
        <input type="text" name="name" value="Dr. Richard James" required>
        
        <label>Email:</label>
        <input type="email" name="email" value="richard@demo.com" required>
        
        <label>Password:</label>
        <input type="password" name="password" value="12345678" required>
        
        <label>Speciality:</label>
        <input type="text" name="speciality" value="General physician" required>
        
        <label>Degree:</label>
        <input type="text" name="degree" value="MBBS" required>
        
        <label>Experience:</label>
        <input type="text" name="experience" value="4 Years" required>
        
        <label>About:</label>
        <textarea name="about" required>Dr. Davis has a strong commitment to delivering comprehensive medical care.</textarea>
        
        <label>Fees:</label>
        <input type="number" name="fees" value="60" required>
        
        <label>Address (JSON):</label>
        <input type="text" name="address" value='{"line1":"17th Cross, Richmond","line2":"Circle, Ring Road, London"}' required>
        
        <label>Image:</label>
        <input type="file" name="image" accept="image/*" required>
        
        <br><br>
        <button type="submit">🚀 Add Doctor</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('doctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '⏳ Uploading...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('http://localhost:4000/api/admin/add-doctor', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = '✅ ' + data.message;
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = '❌ ' + data.message;
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.innerHTML = '❌ Error: ' + error.message;
                resultDiv.className = 'error';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
